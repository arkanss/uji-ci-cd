name: Publish

on:
  workflow_dispatch:
  push:
    branches:
      - staging
      - ci/*
    tags:
      - "*"

env:
  DOCKER_REGISTRY: "docker.io"
  DOCKER_USERNAME: "localplace"
  IMAGE_NAME: "cms-php"
  IMAGE_TAG: "docker.io/localplace/cms-php:latest"

jobs:
  build:
    # Only build & push when publishing a production tag (v*). Staging will
    # be handled by the `staging-deploy` job which builds on the remote host.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug event info
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Branch or tag: ${{ github.ref_name }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag for any Git tag (production)
            type=ref,event=tag
      - name: Debug metadata
        run: |
          echo "Generated tags: ${{ steps.meta.outputs.tags }}"
          echo "Generated labels: ${{ steps.meta.outputs.labels }}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging-deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/heads/ci/'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare SSH and rsync
        run: |
          sudo apt-get update -y
          sudo apt-get install -y rsync openssh-client

      - name: Setup SSH key
        run: |
          eval "$(ssh-agent -s)"
          echo "${{ secrets.SSH_LOCALPLACE_KEY_SERVER }}" | base64 -d -i | tr -d '\r' | ssh-add -
          mkdir -p ~/.ssh
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Sync repo to remote
        env:
          SSH_TARGET: ${{ secrets.SSH_LOCALPLACE_USER_SERVER }}@${{ secrets.SSH_LOCALPLACE_HOST_SERVER }}
        run: |
          rsync -az --delete --exclude='.git' --exclude='node_modules' --exclude='vendor' --exclude='storage' -e "ssh -o StrictHostKeyChecking=no" ./ $SSH_TARGET:/home/staging-cms/repo/

      - name: Copy docker-compose to remote
        env:
          SSH_TARGET: ${{ secrets.SSH_LOCALPLACE_USER_SERVER }}@${{ secrets.SSH_LOCALPLACE_HOST_SERVER }}
        run: |
          scp .docker/docker-compose.staging.yml $SSH_TARGET:/home/staging-cms/docker-compose.staging.yml

      - name: Deploy on remote (build & up)
        env:
          SSH_TARGET: ${{ secrets.SSH_LOCALPLACE_USER_SERVER }}@${{ secrets.SSH_LOCALPLACE_HOST_SERVER }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
        run: |
          ssh $SSH_TARGET "mkdir -p /home/staging-cms && cd /home/staging-cms && mv repo/* . || true"
          ssh $SSH_TARGET "cd /home/staging-cms && docker compose -f docker-compose.staging.yml up -d --build --remove-orphans"
          # Run migrations and caches inside the service (use compose exec or run)
          ssh $SSH_TARGET "cd /home/staging-cms && docker compose -f docker-compose.staging.yml exec -T app php artisan migrate --force || docker compose -f docker-compose.staging.yml run --rm app php artisan migrate --force"
          ssh $SSH_TARGET "cd /home/staging-cms && docker compose -f docker-compose.staging.yml exec -T app php artisan config:cache || true"
          ssh $SSH_TARGET "cd /home/staging-cms && docker compose -f docker-compose.staging.yml exec -T app php artisan route:cache || true"
          ssh $SSH_TARGET "cd /home/staging-cms && docker compose -f docker-compose.staging.yml exec -T app php artisan view:cache || true"

  staging-migrate:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/heads/ci/'))
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Fetch current + previous commit to detect new files

      - name: Run migration
        env:
          SSH_TARGET: ${{ secrets.SSH_LOCALPLACE_USER_SERVER }}@${{ secrets.SSH_LOCALPLACE_HOST_SERVER }}
        run: |
          # Setup SSH (optimized)
          eval "$(ssh-agent -s)"
          echo "${{ secrets.SSH_LOCALPLACE_KEY_SERVER }}" | base64 -d -i | tr -d '\r' | ssh-add -
          mkdir -p ~/.ssh
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

          # Detect new migration files (git diff approach)
          NEW_MIGRATIONS=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'database/migrations/*.php' || echo "")

          if [ -n "$NEW_MIGRATIONS" ]; then
            echo "New migrations detected:"
            echo "$NEW_MIGRATIONS"

            # Create migration directory
            ssh $SSH_TARGET "mkdir -p /home/staging-cms/migration/database/migrations"

            # Transfer only new migration files
            echo "$NEW_MIGRATIONS" | while read -r file; do
              if [ -n "$file" ]; then
                echo "Copying $file"
                scp "$file" $SSH_TARGET:/home/staging-cms/migration/database/migrations/
              fi
            done
          else
            echo "No new migrations detected, syncing all files"
            ssh $SSH_TARGET "mkdir -p /home/staging-cms/migration/database"
            rsync -az --delete -e ssh ./database/migrations/ $SSH_TARGET:/home/staging-cms/migration/database/migrations/
          fi

          # Decode DATABASE_URL
          DATABASE_URL=$(echo ${{ secrets.DATABASE_URL_STAGING }} | base64 -d)

          # Run migrations using a temporary Docker container
          ssh $SSH_TARGET "docker run --rm \
            --network staging-private \
            -v /home/staging-cms/migration/database/migrations:/var/www/html/database/migrations \
            -e DATABASE_URL='$DATABASE_URL' \
            --add-host docker.host.internal:host-gateway \
            ${{ env.IMAGE_TAG }} \
            php artisan migrate --force"

  staging-deploy:
    needs: staging-migrate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/heads/ci/'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy
        env:
          SSH_TARGET: ${{ secrets.SSH_LOCALPLACE_USER_SERVER }}@${{ secrets.SSH_LOCALPLACE_HOST_SERVER }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          # Setup SSH
          sudo apt-get update && sudo apt-get install -y openssh-client
          eval "$(ssh-agent -s)"
          echo "${{ secrets.SSH_LOCALPLACE_KEY_SERVER }}" | base64 -d -i | tr -d '\r' | ssh-add -
          mkdir -p ~/.ssh
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

          # Update docker-compose file with actual values
          sed -i "s|PLACEHOLDER_IMAGE|${IMAGE_TAG}|g" .docker/docker-compose.staging.yml

          # Log in to Docker Hub on remote server
          ssh $SSH_TARGET "docker login -u ${{ env.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }} ${{ env.DOCKER_REGISTRY }}"

          # Pull image
          ssh $SSH_TARGET "docker pull ${IMAGE_TAG}"

          # Copy docker-compose file to remote server
          scp .docker/docker-compose.staging.yml $SSH_TARGET:/home/staging-cms/docker-compose.staging.yml

          # Deploy
          ssh $SSH_TARGET "docker stack deploy -c /home/staging-cms/docker-compose.staging.yml --detach=false --with-registry-auth --resolve-image=always staging-cms"

          # Run post-deployment commands
          ssh $SSH_TARGET 'CONTAINER_ID=$(docker ps -q -f "name=staging-cms_app" | head -n1) && docker exec $CONTAINER_ID php artisan config:cache'
          ssh $SSH_TARGET 'CONTAINER_ID=$(docker ps -q -f "name=staging-cms_app" | head -n1) && docker exec $CONTAINER_ID php artisan route:cache'
          ssh $SSH_TARGET 'CONTAINER_ID=$(docker ps -q -f "name=staging-cms_app" | head -n1) && docker exec $CONTAINER_ID php artisan view:cache'

  production-migrate:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history to compare with previous tag

      - name: Run migration
        env:
          SSH_TARGET: ${{ secrets.SSH_LOCALPLACE_USER_SERVER }}@${{ secrets.SSH_LOCALPLACE_HOST_SERVER }}
        run: |
          # Setup SSH (optimized)
          eval "$(ssh-agent -s)"
          echo "${{ secrets.SSH_LOCALPLACE_KEY_SERVER }}" | base64 -d -i | tr -d '\r' | ssh-add -
          mkdir -p ~/.ssh
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

          # Get previous tag for comparison
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            echo "Comparing with previous tag: $PREV_TAG"
            NEW_MIGRATIONS=$(git diff --name-only --diff-filter=A $PREV_TAG HEAD -- 'database/migrations/*.php' || echo "")
          else
            echo "No previous tag found, treating all migrations as new"
            NEW_MIGRATIONS=""
          fi

          if [ -n "$NEW_MIGRATIONS" ]; then
            echo "New migrations detected since $PREV_TAG:"
            echo "$NEW_MIGRATIONS"

            # Create migration directory
            ssh $SSH_TARGET "mkdir -p /home/production-cms/migration/database/migrations"

            # Transfer only new migration files
            echo "$NEW_MIGRATIONS" | while read -r file; do
              if [ -n "$file" ]; then
                echo "Copying $file"
                scp "$file" $SSH_TARGET:/home/production-cms/migration/database/migrations/
              fi
            done
          else
            echo "No new migrations detected, syncing all files"
            ssh $SSH_TARGET "mkdir -p /home/production-cms/migration/database"
            rsync -az --delete -e ssh ./database/migrations/ $SSH_TARGET:/home/production-cms/migration/database/migrations/
          fi

          # Decode DATABASE_URL
          DATABASE_URL=$(echo ${{ secrets.DATABASE_URL_CMS_PROD }} | base64 -d)

          # Run migrations using a temporary Docker container
          ssh $SSH_TARGET "docker run --rm \
            --network prod-private \
            -v /home/production-cms/migration/database/migrations:/var/www/html/database/migrations \
            -e DATABASE_URL='$DATABASE_URL' \
            --add-host docker.host.internal:host-gateway \
            ${{ env.IMAGE_TAG }} \
            php artisan migrate --force"
          echo 'Migration completed on production server'

  deploy-production:
    runs-on: ubuntu-latest
    needs: production-migrate
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VM using SSH
        timeout-minutes: 5
        env:
          SSH_TARGET: ${{ secrets.SSH_LOCALPLACE_USER_SERVER }}@${{ secrets.SSH_LOCALPLACE_HOST_SERVER }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          # Setup SSH
          sudo apt-get update && sudo apt-get install -y openssh-client
          eval "$(ssh-agent -s)"
          echo "${{ secrets.SSH_LOCALPLACE_KEY_SERVER }}" | base64 -d -i | tr -d '\r' | ssh-add -
          mkdir -p ~/.ssh
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

          # Update docker-compose file with actual values
          sed -i "s|PLACEHOLDER_IMAGE|${IMAGE_TAG}|g" .docker/docker-compose.prod.yml

          # Log in to Docker Hub on remote server
          ssh $SSH_TARGET "docker login -u ${{ env.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }} ${{ env.DOCKER_REGISTRY }}"

          # Pull image
          ssh $SSH_TARGET "docker pull ${IMAGE_TAG}"

          # Copy docker-compose file to remote server
          scp .docker/docker-compose.prod.yml $SSH_TARGET:/home/production-cms/docker-compose.prod.yml

          # Deploy
          ssh $SSH_TARGET "docker stack deploy -c /home/production-cms/docker-compose.prod.yml --detach=false --with-registry-auth --resolve-image=always cms"

          # Run post-deployment commands
          ssh $SSH_TARGET 'CONTAINER_ID=$(docker ps -q -f "name=cms_app" | head -n1) && docker exec $CONTAINER_ID php artisan config:cache'
          ssh $SSH_TARGET 'CONTAINER_ID=$(docker ps -q -f "name=cms_app" | head -n1) && docker exec $CONTAINER_ID php artisan route:cache'
          ssh $SSH_TARGET 'CONTAINER_ID=$(docker ps -q -f "name=cms_app" | head -n1) && docker exec $CONTAINER_ID php artisan view:cache'
