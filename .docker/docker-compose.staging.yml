services:
  app:
    # Uncomment to build locally, or use pre-built image
    # build:
    #   context: ..
    #   dockerfile: Dockerfile
    #   args:
    #     APP_ENV: production
    image: PLACEHOLDER_IMAGE
    environment:
      APP_NAME: "Local Place CMS"
      APP_ENV: staging
      APP_DEBUG: "true"
      APP_KEY: /run/secrets/staging_app_key
      APP_URL: https://demo-cms.localplace.id
      API_URL: https://demo.localplace.id/api/v1
      APP_LOCALE: en
      APP_FALLBACK_LOCALE: en
      APP_FAKER_LOCALE: en_US
      APP_MAINTENANCE_DRIVER: file
      BCRYPT_ROUNDS: 12
      LOG_CHANNEL: stack
      LOG_STACK: single
      LOG_LEVEL: info
      DB_CONNECTION: pgsql
      DB_HOST: docker.host.internal
      DB_PORT: 5432
      DB_DATABASE: localplace_staging
      DB_USERNAME: localplace_staging
      DB_PASSWORD: /run/secrets/staging_db_password
      SESSION_DRIVER: redis
      SESSION_LIFETIME: 120
      SESSION_ENCRYPT: "false"
      SESSION_PATH: /
      SESSION_DOMAIN: .localplace.id
      BROADCAST_CONNECTION: log
      FILESYSTEM_DISK: s3
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: staging-redis_redis
      REDIS_PASSWORD: null
      REDIS_PORT: 6379
      TZ: Asia/Jakarta
    extra_hosts:
      - docker.host.internal:host-gateway
    secrets:
      - staging_app_key
      - staging_db_password
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik-public"
        - "traefik.constraint-label=traefik-public"
        - "traefik.http.routers.staging-cms.rule=Host(`demo-cms.localplace.id`)"
        - "traefik.http.routers.staging-cms.entrypoints=http"
        - "traefik.http.routers.staging-cms-https.rule=Host(`demo-cms.localplace.id`)"
        - "traefik.http.routers.staging-cms-https.entrypoints=https"
        - "traefik.http.routers.staging-cms-https.tls.certresolver=le"
        - "traefik.http.routers.staging-cms-https.tls=true"
        - "traefik.http.services.staging-cms-https.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 10s
    networks:
      - traefik-public
      - staging-private

secrets:
  staging_app_key:
    external: true
  staging_db_password:
    external: true

networks:
  traefik-public:
    external: true
  staging-private:
    external: true
